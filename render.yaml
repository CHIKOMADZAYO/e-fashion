services:
  - type: web
    name: estore
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn ecommerce.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: MPESA_ENVIRONMENT
        value: "sandbox"
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: "https://estore.onrender.com/payments/callback/stk"
      - key: MPESA_CALLBACK_TOKEN
        sync: false
      - key: MPESA_TRANSACTION_TYPE
        value: "CustomerPayBillOnline"
    disk:
      name: estore-disk
      mountPath: /var/lib/estore
      sizeGB: 1
databases:
  - name: estore-db
    plan: free
    region: oregon
